[project]
name = "speech-pipeline-hybrid-fast"
version = "1.0.0"
description = "SPEECH-PIPELINE-HYBRID-FAST: 極速非自回歸 ASR 與輕量 LLM 混合轉錄系統"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "funasr>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "opencc-python-reimplemented>=0.1.7",
    "python-multipart>=0.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
